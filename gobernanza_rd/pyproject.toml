[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["node-telecaster", "credentials"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F821", "F841", "F811", "E701", "E712", "E402", "F541"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = [
    "import-not-found",
    "import-untyped",
    "name-defined",
    "attr-defined",
    "arg-type",
    "call-arg",
    "return-value",
    "misc",
    "valid-type",
    "index",
    "operator",
    "union-attr",
    "assignment",
    "var-annotated",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]